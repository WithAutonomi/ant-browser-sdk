<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minimal Autonomi Browser SDK example" />
    <title>Autonomi Browser SDK — All in one</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">@withautonomi/browser-sdk · all-in-one</p>
      <h1>A complete client in one page</h1>
      <p class="lede">
        Connect directly to Autonomi nodes over certificate-pinned WebRTC, then
        upload, download, or stream a public file.
      </p>

      <section>
        <h2>1. Connect</h2>
        <label for="bootstrap">WebRTC Direct bootstrap multiaddress</label>
        <input
          id="bootstrap"
          placeholder="/ip4/127.0.0.1/udp/24000/webrtc-direct/certhash/.../p2p/..."
          spellcheck="false"
        />
        <button id="connect">Connect</button>
        <output id="connection">Not connected</output>
      </section>

      <section>
        <h2>2. Upload</h2>
        <label for="payment-rpc">Payment RPC URL</label>
        <input id="payment-rpc" type="url" autocomplete="off" placeholder="http://127.0.0.1:8545" />
        <label for="wallet">Paying wallet private key (local devnet only)</label>
        <input id="wallet" type="password" autocomplete="off" />
        <label for="upload-input">Public file</label>
        <input id="upload-input" type="file" />
        <button id="upload" disabled>Pay and upload</button>
      </section>

      <section>
        <h2>3. Read</h2>
        <label for="address">Public DataMap address</label>
        <input id="address" placeholder="64 hexadecimal characters" />
        <div class="actions">
          <button id="download" disabled>Download and save</button>
          <button id="stream" disabled>Stream as media</button>
        </div>
        <video id="media" controls hidden></video>
      </section>

      <section>
        <h2>Progress</h2>
        <pre id="log">Ready.</pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
