name: Release

# Merging a change to main that sets an untagged `package.json` version publishes
# that version to npm and tags the merge commit `v<version>`; pushes to main whose
# version is already tagged release nothing. Pushing a `v<version>` tag on main
# publishes that version too. Running the workflow manually performs every release
# check and packs the tarball without publishing it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    name: Determine the release
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and dist-tag
        id: meta
        shell: bash
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          publish=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error title=Tag does not match package.json::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Tag the release as ${tag}."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error title=Tag is not on main::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A push to main releases its version once: the release tags it.
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} is already tagged; nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            publish=true
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

          # Same dist-tag policy as @withautonomi/ant: the first dot-separated pre-release
          # identifier decides, and an unrecognised one fails rather than moving `latest`.
          pre=""
          if [ "$version" != "${version%%-*}" ]; then
            pre="${version#*-}"
          fi
          if [ -z "$pre" ]; then
            dist_tag="latest"
          else
            case "${pre%%.*}" in
              beta) dist_tag="beta" ;;
              rc) dist_tag="rc" ;;
              *)
                echo "::error title=Unrecognised pre-release::Version ${version} has pre-release identifier '${pre%%.*}', which maps to no npm dist-tag."
                exit 1
                ;;
            esac
          fi

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "Releasing ${name}@${version} to dist-tag ${dist_tag}"
          else
            echo "Checking ${name}@${version} without publishing"
          fi

  package:
    name: Verify and pack
    needs: decide
    if: needs.decide.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The published WASM must be a clean build of a commit on ant-client main.
      - name: Verify WASM provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:wasm

      - run: npm run check
      - run: npm run build:examples

      - name: Pack
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          tarball="$(basename "$RUNNER_TEMP"/package/*.tgz)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          {
            echo "### Package"
            echo
            echo "\`${tarball}\`, SHA-256 \`$(sha256sum "$RUNNER_TEMP/package/${tarball}" | cut -d' ' -f1)\`"
            echo
            echo "WASM: ant-client \`$(node -p 'require("./src/wasm/source.json").revision')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [decide, package]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Create the GitHub release, and its tag after a merge to main.
      contents: write
      # npm provenance and trusted publishing exchange this token with the registry.
      id-token: write
    env:
      NAME: ${{ needs.decide.outputs.name }}
      VERSION: ${{ needs.decide.outputs.version }}
      TAG: ${{ needs.decide.outputs.tag }}
      DIST_TAG: ${{ needs.decide.outputs.dist_tag }}
      TARBALL_NAME: ${{ needs.package.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - run: npm install --global npm@11

      # Publishes the tarball tested by the package job. Authenticates through an npm
      # trusted publisher for this workflow, or through the NPM_TOKEN secret.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # A re-run after a successful publish must not fail on the existing version.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice title=Already published::${NAME}@${VERSION} is already in the registry; skipping."
            exit 0
          fi

          # npm sets `latest` on a package's first publish whatever --tag says, so a
          # pre-release must not be the first version published.
          if [ "$DIST_TAG" != "latest" ]; then
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2F}")"
            case "$status" in
              200) ;;
              404)
                echo "::error title=Pre-release before first stable release::${NAME} has never been published. npm would make ${VERSION} the 'latest' version. Publish a stable version first."
                exit 1
                ;;
              *)
                echo "::error title=Registry check failed::Unexpected HTTP ${status} from the npm registry while checking whether ${NAME} exists."
                exit 1
                ;;
            esac
          fi

          npm publish "$RUNNER_TEMP/package/$TARBALL_NAME" --access public --provenance --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release exists::GitHub release ${TAG} already exists; skipping."
            exit 0
          fi
          prerelease=()
          if [ "$DIST_TAG" != "latest" ]; then
            prerelease=(--prerelease)
          fi
          # A pushed tag already exists; after a merge, the release creates the tag
          # on the merge commit. Tags made with this token start no other workflow.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "$RUNNER_TEMP/package/$TARBALL_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${target[@]}" \
            --generate-notes \
            "${prerelease[@]}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### npm"
            echo
            echo "Published \`${NAME}@${VERSION}\` to dist-tag \`${DIST_TAG}\`."
            echo
            echo '```sh'
            if [ "$DIST_TAG" = "latest" ]; then
              echo "npm install ${NAME}"
            else
              echo "npm install ${NAME}@${DIST_TAG}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
